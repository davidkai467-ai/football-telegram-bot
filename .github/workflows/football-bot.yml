name: Football bot

on:
  schedule:
    - cron: "0 */12 * * *"      # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: "run"
        options: [run, backtest, report]

permissions:
  contents: write              # lets the job commit the log files

concurrency:
  group: football-bot          # never run two at once
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests numpy scipy

      - name: Run bot
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            backtest) python football_bot.py --backtest ;;
            report)   python football_bot.py --report ;;
            *)        python football_bot.py ;;
          esac

      - name: Save logs back to the repo
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          for f in sent_alerts.json predictions_log.csv results_log.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || (git commit -m "Update bot logs" && git push)
